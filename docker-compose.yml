services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freshflow
      POSTGRES_PASSWORD: freshflow
      POSTGRES_DB: freshflow
    ports:
      - "5432:5432"
    volumes:
      - freshflow_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshflow -d freshflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  freshflow_postgres:
